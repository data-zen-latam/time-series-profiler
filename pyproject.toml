[project]
name = "ts-profiler"
version = "0.1.0"
description = "Profiler of time series to assess quality and predictability"
authors = [
    {name = "Carlo Arias", email = "Carlo_Arias@epam.com"},
    {name = "Sergio M. Ferro", email = "Sergio_Ferro@epam.com"},
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0", 
    "statsmodels>=0.13.0",
    "scikit-learn>=1.0.0",
    "tsfresh>=0.20.0",
    "numba>=0.56.0",  # Force newer numba that supports Python 3.11+
    "llvmlite>=0.39.0",  # Force newer llvmlite that supports Python 3.11+
    "setuptools",  # Required for pkg_resources used by tsfresh
]

[project.optional-dependencies]
spark = ["pyspark>=3.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0", 
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ts_profiler --cov-report=xml --cov-report=term"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"research/*" = ["E501", "B018", "F811", "E402"]
"ts_profiler/features.py" = ["F403", "F405"]

[tool.coverage.run]
source = ["ts_profiler"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
