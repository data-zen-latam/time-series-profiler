name: Test Data Quality Module

on:
  push:
    branches: [main]
    paths:
      - 'src/data_quality.py'
      - 'tests/test_data_quality.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - '.github/workflows/test-data-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/data_quality.py'
      - 'tests/test_data_quality.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'

jobs:
  test-data-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run Data Quality Tests
        run: uv run pytest tests/test_data_quality.py -v --tb=short
      
      - name: Run Data Quality Coverage
        run: uv run pytest tests/test_data_quality.py --cov=src.data_quality --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: data_quality
          fail_ci_if_error: false
